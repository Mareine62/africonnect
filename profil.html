<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon profil - AfriConnect</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    html {
      min-height: 100%;
      background-color: #f1f5f9;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background-color: #f1f5f9;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .site-header {
      background: #102b55;
      color: #ffffff;
    }

    .site-header a {
      color: #ffffff;
    }

    .container {
      width: 92%;
      max-width: 850px;
      margin: 28px auto;
    }

    .card {
      background: #ffffff;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid #e1e7ef;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    .profile-header {
      text-align: center;
      border-top: 4px solid #12b886;
    }

    h1, h2 {
      color: #102b55;
    }

    .muted {
      color: #667085;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dce7;
      border-radius: 9px;
      background: #ffffff;
      color: #172033;
      font-size: 16px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: 2px solid #12b886;
      outline-offset: 1px;
    }

    .btn-accent {
      display: inline-block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #12b886;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-accent:hover {
      background: #0ca678;
    }

    #profileMessage {
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .site-footer {
      padding: 24px 12px;
      text-align: center;
      color: #667085;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
        margin: 16px auto;
      }

      .card {
        padding: 18px;
      }

      .actions .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="dashboard.html">AfriConnect</a>

      <nav class="navigation">
        <a href="index.html">Accueil</a>
        <a href="dashboard.html">Tableau de bord</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <section class="card profile-header">
      <h1>Mon profil</h1>
      <p class="muted">
        Présente-toi à la communauté AfriConnect.
      </p>
    </section>

    <section class="card">
      <h2>Mes informations</h2>

      <p>
        <strong>Adresse e-mail :</strong>
        <span id="profileEmail">Chargement...</span>
      </p>

      <form id="profileForm">
        <div class="form-group">
          <label for="profileName">Nom affiché</label>
          <input
            id="profileName"
            name="name"
            type="text"
            maxlength="60"
            placeholder="Ton nom"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="profileBio">Biographie</label>
          <textarea
            id="profileBio"
            name="bio"
            rows="4"
            maxlength="300"
            placeholder="Présente-toi en quelques mots..."
          ></textarea>
        </div>

        <p
          id="profileMessage"
          role="status"
          aria-live="polite"
        ></p>

        <button class="btn-accent" type="submit">
          Enregistrer mon profil
        </button>
      </form>
    </section>

    <section class="card">
      <h2>Navigation</h2>

      <div class="actions">
        <a class="btn" href="dashboard.html">
          Retour au tableau de bord
        </a>

        <a class="btn" href="publications.html">
          Voir les publications
        </a>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    AfriConnect — Connectons nos communautés.
  </footer>

  <script type="module" src="js/profil.js"></script>
</body>
</html>
