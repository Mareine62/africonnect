<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amis - AfriConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <h1>AfriConnect</h1>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="dashboard.html">Tableau de bord</a>
            <a href="profil.html">Mon profil</a>
            <a href="publications.html">Publications</a>
            <a href="amis.html">Mes amis</a>
            <a href="messages.html">Messages</a>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h2>Mes amis</h2>
            <p>Retrouve les membres de la communauté AfriConnect.</p>
        </section>

        <section class="card">
            <h2>Rechercher un membre</h2>
            <form id="friendSearchForm">
                <label for="friendEmail">Adresse e-mail du membre</label>
                <input
                    type="email"
                    id="friendEmail"
                    placeholder="membre@exemple.com"
                    required
                >
                <button type="submit">Rechercher</button>
            </form>

            <p id="friendSearchStatus" role="status"></p>
            <div id="friendSearchResults"></div>
        </section>

        <section class="card">
            <h2>Ma liste d'amis</h2>
            <div id="friendsList">
                <p>La liste des amis apparaîtra ici.</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>AfriConnect — Connectons nos communautés.</p>
    </footer>

</body>
</html>
