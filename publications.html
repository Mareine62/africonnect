<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications - AfriConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <h1>AfriConnect</h1>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="dashboard.html">Tableau de bord</a>
            <a href="profil.html">Mon profil</a>
            <a href="publications.html">Publications</a>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h2>Partager une publication</h2>
            <p>Exprime-toi et partage tes idées avec la communauté.</p>

            <form id="postForm">
                <label for="postContent">Que veux-tu partager ?</label>
                <textarea
                    id="postContent"
                    rows="5"
                    maxlength="2000"
                    placeholder="Écris ta publication ici..."
                    required
                ></textarea>

                <button type="submit">Publier</button>
            </form>

            <p id="postMessage" role="status"></p>
        </section>

        <section class="card">
            <h2>Publications récentes</h2>
            <div id="postsList">
                <p>Chargement des publications...</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>AfriConnect — Connectons nos communautés.</p>
    </footer>

    <script type="module" src="js/publications.js"></script>
</body>
</html>
